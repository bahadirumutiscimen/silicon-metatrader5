<text x="28" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" fill="#9198a1">Your code only talks to 127.0.0.1. The bridge is never open to the network.</text>
<text x="28" y="292" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" fill="#9198a1">For a server, the app keeps an encrypted SSH tunnel open; no port is opened on the server.</text>
