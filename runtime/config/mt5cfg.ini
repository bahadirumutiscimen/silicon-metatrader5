; MetaTrader 5 startup configuration (/config:mt5cfg.ini), written by
; launch-mt5.sh. Only keys documented for MT5's startup config are used
; (https://www.metatrader5.com/en/terminal/help/start_advanced/start).
; launch-mt5.sh overrides from .env: MaxBars (SMT5_MAXBARS), Enabled +
; AllowLiveTrading (SMT5_ALGO_TRADING), AllowDllImport (SMT5_DLL_IMPORT).
; 1,000,000 bars per chart froze MT5 under QEMU; 100,000 is the safe default.
[Common]
NewsEnable=0

[Charts]
MaxBars=100000
PrintColor=0

[Experts]
; Enabled = the "Algo Trading" toolbar button; AllowLiveTrading = EAs may trade
Enabled=1
AllowLiveTrading=1
AllowDllImport=0
; MT5 turns Algo Trading off when it logs in to another account or the
; profile changes (also at start-up with a saved account); keep it as set above.
Account=0
Profile=0
