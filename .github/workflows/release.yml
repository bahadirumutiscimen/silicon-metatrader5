name: release

# Push a tag vX.Y.Z (matching app/Cargo.toml) to get a GitHub release with:
#   - SiliconMetaTrader5_<ver>_amd64.AppImage and SiliconMetaTrader5_<ver>_amd64.deb (app + smt5 CLI)
#   - smt5-<ver>-linux-x86_64.tar.gz (CLI only)
#   - siliconmt5.rb (Homebrew formula with the source tarball's sha256, also
#     committed to main as Formula/siliconmt5.rb: this repo is the tap)
# The runtime image for the same tag is published by runtime.yml.
# With docs/releases/vX.Y.Z.md the release is published with those notes;
# without it, it stays a draft.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (vX.Y.Z)"
        required: true
      formula_only:
        description: "Only the source tarball, formula and notes (skip the Linux build)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  linux:
    if: ${{ !inputs.formula_only }}
    runs-on: ubuntu-22.04          # older glibc → the AppImage runs on more distros
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: version matches the tag
        run: |
          v="$(sed -n 's/^version = "\(.*\)"/\1/p' app/Cargo.toml | head -1)"
          test "v$v" = "$TAG" || { echo "tag $TAG != app version v$v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: build dependencies (WebKitGTK, tray, AppImage)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file
      - name: tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: smt5 CLI (also packed into the .deb)
        working-directory: app
        run: cargo build --release --locked -p smt5-cli
      - name: AppImage + .deb
        working-directory: app/crates/smt5-desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: cargo tauri build --bundles appimage,deb
      - name: collect
        run: |
          mkdir -p dist
          cp app/target/release/bundle/appimage/*.AppImage app/target/release/bundle/deb/*.deb dist/
          tar -C app/target/release -czf "dist/smt5-$VERSION-linux-x86_64.tar.gz" smt5
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/

  # This repository is its own Homebrew tap: the rendered formula is attached
  # to the release and committed to main as Formula/siliconmt5.rb.
  #   brew tap bahadirumutiscimen/siliconmt5 https://github.com/bahadirumutiscimen/silicon-metatrader5
  #   brew trust bahadirumutiscimen/siliconmt5
  #   brew install siliconmt5
  formula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      # The source tarball is attached to the release and the formula points
      # at that copy: release assets have a download count, GitHub's own
      # archive links do not, so every brew install/upgrade is counted.
      - name: render the Homebrew formula
        run: |
          v="${TAG#v}"
          mkdir -p dist Formula
          curl -fsSL -o "dist/silicon-metatrader5-$v.tar.gz" "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          sha="$(sha256sum "dist/silicon-metatrader5-$v.tar.gz" | cut -d' ' -f1)"
          sed -e "s/@VERSION@/$v/g" -e "s/@SHA256@/$sha/" packaging/homebrew/siliconmt5.rb > dist/siliconmt5.rb
          cp dist/siliconmt5.rb Formula/siliconmt5.rb
          grep -E '^\s+(url|sha256) ' Formula/siliconmt5.rb
      - uses: actions/upload-artifact@v4
        with:
          name: formula
          path: dist/
      - name: commit Formula/siliconmt5.rb to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/siliconmt5.rb
          if git diff --cached --quiet; then echo "formula unchanged"; exit 0; fi
          git commit -m "brew: siliconmt5 ${TAG#v}"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1

  release:
    needs: [linux, formula]
    if: ${{ always() && needs.formula.result == 'success' && (needs.linux.result == 'success' || needs.linux.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          path: src
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # docs/releases/<tag>.md present: the release gets those notes and is
      # published once every file is uploaded. Otherwise: a draft with
      # generated notes, to check and publish by hand.
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          notes="src/docs/releases/${TAG}.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --title "SiliconMetaTrader5 ${TAG#v}" "$@"
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber dist/*
          if [ -f "$notes" ]; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file "$notes" --draft=false --latest
          fi
